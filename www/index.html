<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Monza Multijoueur Racing</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #111; font-family: Arial, sans-serif; color: white; }
        #gameCanvas { display: block; background: #2b7a0b; }
        #ui { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; font-size: 18px; font-weight: bold; text-shadow: 2px 2px #000; pointer-events: none; z-index: 5; }
        #controls { position: absolute; bottom: 20px; left: 0; right: 0; display: flex; justify-content: space-between; padding: 0 20px; pointer-events: none; z-index: 5; }
        .control-group { display: flex; gap: 15px; pointer-events: auto; }
        .btn { width: 80px; height: 80px; background: rgba(255, 255, 255, 0.3); border: 3px solid white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; color: white; touch-action: manipulation; }
        .btn:active, .btn.pressed { background: rgba(255, 255, 255, 0.7); transform: scale(0.95); }
        #connectionScreen, #roomScreen, #lobbyScreen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; }
        h1 { margin-bottom: 10px; font-size: 32px; color: #ffcc00; text-align: center; }
        input { padding: 12px; font-size: 18px; border-radius: 8px; border: none; margin-bottom: 20px; width: 80%; max-width: 300px; text-align: center; }
        .menu-btn { padding: 15px 30px; font-size: 20px; font-weight: bold; background: #ffcc00; color: #111; border: none; border-radius: 30px; cursor: pointer; margin: 5px; }
        .room-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin: 20px; }
        .room-btn { padding: 20px; font-size: 16px; font-weight: bold; background: #333; color: white; border: 2px solid #ffcc00; border-radius: 10px; cursor: pointer; text-align: center; }
        .room-btn:hover { background: #555; }
        .player-list { margin: 20px; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 10px; min-width: 250px; }
        .player-list div { padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body>
    <div id="ui">
        <div id="speedometer">Vitesse: 0 km/h</div>
        <div id="chrono" style="font-size: 14px; text-align: center;">Tour: 0.00s<br>Dernier: -- | Meilleur: --</div>
        <div id="leaderboard" style="font-size: 14px; text-align: center;">
            <div style="font-weight: bold; margin-bottom: 5px;">TOP 10</div>
            <div id="leaderboardList">En attente...</div>
        </div>
        <div id="status">Statut: Déconnecté</div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="controls">
        <div class="control-group">
            <div class="btn" id="leftBtn">◀</div>
            <div class="btn" id="rightBtn">▶</div>
        </div>
        <div class="control-group">
            <div class="btn" id="brakeBtn">REC</div>
            <div class="btn" id="accelBtn">GO</div>
        </div>
    </div>

    <!-- Page de connexion -->
    <div id="connectionScreen">
        <h1>MONZA MULTIJOUEUR</h1>
        <p>Entrez votre surnom :</p>
        <input type="text" id="nicknameInput" value="Pilote">
        <button class="menu-btn" id="connectBtn">CONNEXION</button>
    </div>

    <!-- Choix de la salle -->
    <div id="roomScreen" style="display: none;">
        <h1>CHOIX DE LA SALLE</h1>
        <p>Sélectionnez une salle d'attente (5 min max)</p>
        <div class="room-grid" id="roomGrid"></div>
    </div>

    <!-- Salle d'attente -->
    <div id="lobbyScreen" style="display: none;">
        <h1>SALLE D'ATTENTE</h1>
        <p id="lobbyRoomId">Salle 1</p>
        <p id="lobbyTimer">Temps restant: 5:00</p>
        <div class="player-list" id="lobbyPlayers"></div>
        <button class="menu-btn" id="startGameBtn">DÉMARRER LA COURSE</button>
        <button class="menu-btn" id="leaveRoomBtn" style="background: #e63946; color: white;">QUITTER LA SALLE</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let ws = null;
        const scale = 4;
        let players = {};
        let myId = null;
        let inputs = { left: false, right: false, accel: false, brake: false };
        let currentRoom = null;

        const carImg = new Image();
        carImg.src = 'ferrari.png';
        let imgLoaded = false;
        carImg.onload = () => { imgLoaded = true; };

        function bindButton(id, keyName) {
            const el = document.getElementById(id);
            el.addEventListener('touchstart', (e) => { e.preventDefault(); inputs[keyName] = true; el.classList.add('pressed'); sendInputs(); });
            el.addEventListener('touchend', (e) => { e.preventDefault(); inputs[keyName] = false; el.classList.remove('pressed'); sendInputs(); });
            el.addEventListener('mousedown', (e) => { e.preventDefault(); inputs[keyName] = true; el.classList.add('pressed'); sendInputs(); });
            el.addEventListener('mouseup', (e) => { e.preventDefault(); inputs[keyName] = false; el.classList.remove('pressed'); sendInputs(); });
        }

        bindButton('leftBtn', 'left');
        bindButton('rightBtn', 'right');
        bindButton('accelBtn', 'accel');
        bindButton('brakeBtn', 'brake');

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'q' || e.key === 'Q') inputs.left = true;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') inputs.right = true;
            if (e.key === 'ArrowUp' || e.key === 'z' || e.key === 'Z' || e.key === 'w' || e.key === 'W') inputs.accel = true;
            if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S' || e.key === 'r' || e.key === 'R') inputs.brake = true;
            sendInputs();
        });
        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'q' || e.key === 'Q') inputs.left = false;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') inputs.right = false;
            if (e.key === 'ArrowUp' || e.key === 'z' || e.key === 'Z' || e.key === 'w' || e.key === 'W') inputs.accel = false;
            if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S' || e.key === 'r' || e.key === 'R') inputs.brake = false;
            sendInputs();
        });

        function sendInputs() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'input', inputs }));
            }
        }

        // Page de connexion
        document.getElementById('connectBtn').addEventListener('click', () => {
            ws = new WebSocket('ws://localhost:3000');

            ws.onopen = () => {
                const nickname = document.getElementById('nicknameInput').value || 'Pilote';
                ws.send(JSON.stringify({ type: 'join', nickname }));
                
                document.getElementById('connectionScreen').style.display = 'none';
                document.getElementById('roomScreen').style.display = 'flex';
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                
                if (data.type === 'roomList') {
                    // Mettre à jour l'affichage des salles
                    const roomGrid = document.getElementById('roomGrid');
                    roomGrid.innerHTML = '';
                    data.rooms.forEach(room => {
                        let btn = document.createElement('button');
                        btn.className = 'room-btn';
                        let playersText = room.players.length > 0 ? room.players.join(', ') : 'Vide';
                        btn.innerHTML = `Salle ${room.id + 1}<br><small>${room.count}/10</small><br><small style="font-size:10px">${playersText}</small>`;
                        btn.onclick = () => {
                            ws.send(JSON.stringify({ type: 'joinRoom', roomId: room.id }));
                            currentRoom = room.id;
                            document.getElementById('roomScreen').style.display = 'none';
                            document.getElementById('lobbyScreen').style.display = 'flex';
                            document.getElementById('lobbyRoomId').innerText = `Salle ${room.id + 1}`;
                        };
                        if (room.raceStarted) {
                            btn.style.opacity = '0.5';
                            btn.style.cursor = 'not-allowed';
                            btn.onclick = null;
                        }
                        roomGrid.appendChild(btn);
                    });
                } else if (data.type === 'lobby') {
                    // Mise à jour de la salle d'attente
                    document.getElementById('lobbyTimer').innerText = `Temps restant: ${Math.floor(data.timeLeft / 60)}:${(data.timeLeft % 60).toString().padStart(2, '0')}`;
                    
                    let playersHtml = '';
                    if (data.players && data.players.length > 0) {
                        data.players.forEach(p => {
                            playersHtml += `<div>${p.nickname}</div>`;
                        });
                    } else {
                        playersHtml = '<div>Aucun joueur</div>';
                    }
                    document.getElementById('lobbyPlayers').innerHTML = playersHtml;
                    
                    if (data.leaderboard && data.leaderboard.length > 0) {
                        let lbHtml = '';
                        data.leaderboard.forEach((entry, i) => {
                            lbHtml += `<div>${i + 1}. ${entry.nickname} - ${entry.time.toFixed(2)}s</div>`;
                        });
                        document.getElementById('leaderboardList').innerHTML = lbHtml;
                    }
                } else                 if (data.type === 'state') {
                    // Cacher l'écran de lobby si la course a démarré
                    document.getElementById('lobbyScreen').style.display = 'none';
                    document.getElementById('roomScreen').style.display = 'none';
                    document.getElementById('connectionScreen').style.display = 'none';
                    
                    players = data.players;
                    if (!myId) {
                        const ids = Object.keys(players);
                        myId = ids[ids.length - 1];
                    }

                    if (myId && players[myId]) {
                        let me = players[myId];
                        document.getElementById('speedometer').innerText = `Vitesse: ${me.speedKmh} km/h`;
                        document.getElementById('chrono').innerHTML = `Tour: ${me.currentLapTime}s<br>Dernier: ${me.race.lastLapTime ? me.race.lastLapTime.toFixed(2) : '--'}s | Meilleur: ${me.race.bestTime ? me.race.bestTime.toFixed(2) : '--'}s`;
                        
                        if (me.onTrack) {
                            document.getElementById('speedometer').style.color = '#fff';
                        } else {
                            document.getElementById('speedometer').style.color = '#e63946';
                        }
                    }

                    if (data.leaderboard && data.leaderboard.length > 0) {
                        let lbHtml = '';
                        data.leaderboard.forEach((entry, i) => {
                            lbHtml += `<div>${i + 1}. ${entry.nickname} - ${entry.time.toFixed(2)}s</div>`;
                        });
                        document.getElementById('leaderboardList').innerHTML = lbHtml;
                    }
                } else if (data.type === 'error') {
                    alert(data.message);
                } else if (data.type === 'joinedRoom') {
                    // Salle rejointe
                }
            };

            ws.onclose = () => {
                document.getElementById('status').innerText = 'Statut: Déconnecté';
                document.getElementById('connectionScreen').style.display = 'flex';
                document.getElementById('roomScreen').style.display = 'none';
                document.getElementById('lobbyScreen').style.display = 'none';
            };
        });

        // Bouton démarrer la course
        document.getElementById('startGameBtn').addEventListener('click', () => {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'startGame' }));
                document.getElementById('lobbyScreen').style.display = 'none';
            }
        });

        // Bouton quitter la salle
        document.getElementById('leaveRoomBtn').addEventListener('click', () => {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'leaveRoom' }));
                currentRoom = null;
                document.getElementById('lobbyScreen').style.display = 'none';
                document.getElementById('roomScreen').style.display = 'flex';
            }
        });

        const baseMonzaPoints = [
            {x: 500, y: 700}, {x: 1200, y: 700}, {x: 1500, y: 600}, 
            {x: 1600, y: 300}, {x: 1300, y: 150}, {x: 900, y: 150},
            {x: 700, y: 250}, {x: 500, y: 350}, {x: 300, y: 250},
            {x: 200, y: 400}, {x: 200, y: 600}
        ];

        const monzaPoints = baseMonzaPoints.map(p => ({ x: p.x * scale, y: p.y * scale }));

        function drawTrack() {
            ctx.fillStyle = '#2b7a0b';
            ctx.fillRect(-5000, -5000, 15000, 15000);

            const roadWidth = 300;

            ctx.save();
            ctx.lineWidth = roadWidth + 16;
            ctx.strokeStyle = '#fff';
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.beginPath();
            ctx.moveTo(monzaPoints[0].x, monzaPoints[0].y);
            for (let i = 1; i < monzaPoints.length; i++) {
                ctx.lineTo(monzaPoints[i].x, monzaPoints[i].y);
            }
            ctx.closePath();
            ctx.stroke();

            ctx.lineWidth = roadWidth;
            ctx.strokeStyle = '#444';
            ctx.stroke();

            let lineX = monzaPoints[0].x;
            let lineY1 = monzaPoints[0].y - roadWidth / 2;
            let lineY2 = monzaPoints[0].y + roadWidth / 2;

            ctx.lineWidth = 10;
            ctx.strokeStyle = '#ffff00';
            ctx.beginPath();
            ctx.moveTo(lineX, lineY1);
            ctx.lineTo(lineX, lineY2);
            ctx.stroke();
            ctx.restore();
        }

        function drawCar(p) {
            let car = p.car;
            ctx.save();
            ctx.translate(car.x, car.y);
            ctx.rotate(car.angle);

            if (imgLoaded) {
                ctx.save();
                ctx.rotate(-Math.PI / 2);
                ctx.drawImage(carImg, -56, -30, 112, 60);
                ctx.restore();
            } else {
                ctx.fillStyle = '#cc0000';
                ctx.fillRect(-30, -56, 60, 112);
            }

            ctx.rotate(-car.angle);
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 14px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(p.nickname || 'Pilote', 0, -45);

            ctx.restore();
        }

        function loop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (myId && players[myId]) {
                let me = players[myId];
                ctx.save();
                ctx.translate(canvas.width / 2 - me.car.x, canvas.height / 2 - me.car.y);

                drawTrack();

                for (let id in players) {
                    drawCar(players[id]);
                }

                ctx.restore();
            }

            requestAnimationFrame(loop);
        }

        requestAnimationFrame(loop);
    </script>
</body>
</html>
