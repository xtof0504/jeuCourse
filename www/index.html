<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Monza Racing - Client Android</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #111; font-family: Arial, sans-serif; color: white; }
        #gameCanvas { display: block; background: #2b7a0b; }
        #ui { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; font-size: 18px; font-weight: bold; text-shadow: 2px 2px #000; pointer-events: none; z-index: 5; }
        #controls { position: absolute; bottom: 20px; left: 0; right: 0; display: flex; justify-content: space-between; padding: 0 20px; pointer-events: none; z-index: 5; }
        .control-group { display: flex; gap: 15px; pointer-events: auto; }
        .btn { width: 80px; height: 80px; background: rgba(255, 255, 255, 0.3); border: 3px solid white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; color: white; touch-action: manipulation; }
        .btn:active, .btn.pressed { background: rgba(255, 255, 255, 0.7); transform: scale(0.95); }
        #connectionScreen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; }
        h1 { margin-bottom: 10px; font-size: 32px; color: #ffcc00; text-align: center; }
        input { padding: 12px; font-size: 18px; border-radius: 8px; border: none; margin-bottom: 20px; width: 80%; max-width: 300px; text-align: center; }
        .menu-btn { padding: 15px 30px; font-size: 20px; font-weight: bold; background: #ffcc00; color: #111; border: none; border-radius: 30px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="ui">
        <div id="speedometer">Vitesse: 0 km/h</div>
        <div id="status">Statut: Déconnecté</div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="controls">
        <div class="control-group">
            <div class="btn" id="leftBtn">◀</div>
            <div class="btn" id="rightBtn">▶</div>
        </div>
        <div class="control-group">
            <div class="btn" id="brakeBtn">REC</div>
            <div class="btn" id="accelBtn">GO</div>
        </div>
    </div>

    <div id="connectionScreen">
        <h1>MONZA RACING (CLIENT)</h1>
        <p>Entrez l'IP du serveur Windows (ex: 192.168.1.X:3000)</p>
        <input type="text" id="serverIp" value="localhost:3000">
        <button class="menu-btn" id="connectBtn">CONNEXION</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let ws = null;
        const scale = 4;
        let carState = { x: 500 * scale, y: 700 * scale, angle: Math.PI / 2 };
        let speedVal = 0;
        let inputs = { left: false, right: false, accel: false, brake: false };

        function bindButton(id, keyName) {
            const el = document.getElementById(id);
            el.addEventListener('touchstart', (e) => { e.preventDefault(); inputs[keyName] = true; el.classList.add('pressed'); sendInputs(); });
            el.addEventListener('touchend', (e) => { e.preventDefault(); inputs[keyName] = false; el.classList.remove('pressed'); sendInputs(); });
            el.addEventListener('mousedown', (e) => { e.preventDefault(); inputs[keyName] = true; el.classList.add('pressed'); sendInputs(); });
            el.addEventListener('mouseup', (e) => { e.preventDefault(); inputs[keyName] = false; el.classList.remove('pressed'); sendInputs(); });
        }

        bindButton('leftBtn', 'left');
        bindButton('rightBtn', 'right');
        bindButton('accelBtn', 'accel');
        bindButton('brakeBtn', 'brake');

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') inputs.left = true;
            if (e.key === 'ArrowRight') inputs.right = true;
            if (e.key === 'ArrowUp') inputs.accel = true;
            if (e.key === 'ArrowDown') inputs.brake = true;
            sendInputs();
        });
        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft') inputs.left = false;
            if (e.key === 'ArrowRight') inputs.right = false;
            if (e.key === 'ArrowUp') inputs.accel = false;
            if (e.key === 'ArrowDown') inputs.brake = false;
            sendInputs();
        });

        function sendInputs() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'input', inputs }));
            }
        }

        document.getElementById('connectBtn').addEventListener('click', () => {
            const ip = document.getElementById('serverIp.value') || document.getElementById('serverIp').value;
            ws = new WebSocket(`ws://${ip}`);

            ws.onopen = () => {
                document.getElementById('connectionScreen').style.display = 'none';
                document.getElementById('status').innerText = 'Statut: Connecté';
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.type === 'state') {
                    carState = data.car;
                    speedVal = data.speed;
                    if (data.onTrack) {
                        document.getElementById('speedometer').style.color = '#fff';
                    } else {
                        document.getElementById('speedometer').style.color = '#e63946';
                    }
                }
            };

            ws.onclose = () => {
                document.getElementById('status').innerText = 'Statut: Déconnecté';
                document.getElementById('connectionScreen').style.display = 'flex';
            };
        });

        const baseMonzaPoints = [
            {x: 500, y: 700}, {x: 1200, y: 700}, {x: 1500, y: 600}, 
            {x: 1600, y: 300}, {x: 1300, y: 150}, {x: 900, y: 150},
            {x: 700, y: 250}, {x: 500, y: 350}, {x: 300, y: 250},
            {x: 200, y: 400}, {x: 200, y: 600}
        ];

        const monzaPoints = baseMonzaPoints.map(p => ({ x: p.x * scale, y: p.y * scale }));

        function drawTrack() {
            ctx.fillStyle = '#2b7a0b';
            ctx.fillRect(-5000, -5000, 15000, 15000);

            const roadWidth = 300; // 10 fois la largeur de la voiture

            ctx.save();
            ctx.lineWidth = roadWidth + 16;
            ctx.strokeStyle = '#fff';
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.beginPath();
            ctx.moveTo(monzaPoints[0].x, monzaPoints[0].y);
            for (let i = 1; i < monzaPoints.length; i++) {
                ctx.lineTo(monzaPoints[i].x, monzaPoints[i].y);
            }
            ctx.closePath();
            ctx.stroke();

            ctx.lineWidth = roadWidth;
            ctx.strokeStyle = '#444';
            ctx.stroke();
            ctx.restore();
        }

        function drawCar() {
            ctx.save();
            ctx.translate(canvas.width / 2, canvas.height / 2);
            ctx.rotate(carState.angle);

            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.fillRect(-15 + 4, -28 + 4, 30, 56);

            ctx.fillStyle = '#e63946';
            ctx.fillRect(-15, -28, 30, 56);

            ctx.fillStyle = '#1d3557';
            ctx.fillRect(-11, -14, 22, 14);

            ctx.fillStyle = '#111';
            ctx.fillRect(-20, -22, 6, 12);
            ctx.fillRect(14, -22, 6, 12);
            ctx.fillRect(-20, 10, 6, 12);
            ctx.fillRect(14, 10, 6, 12);

            ctx.restore();
        }

        function loop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(canvas.width / 2 - carState.x, canvas.height / 2 - carState.y);

            drawTrack();

            ctx.restore();

            drawCar();

            document.getElementById('speedometer').innerText = `Vitesse: ${speedVal} km/h`;
            requestAnimationFrame(loop);
        }

        requestAnimationFrame(loop);
    </script>
</body>
</html>
